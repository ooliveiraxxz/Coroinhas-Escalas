<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Coroinhas • Servir é amar</title><meta name="theme-color" content="#650b16"><style>
:root{--r:#760d1c;--dark:#480711;--cream:#faf7f3;--line:#eadfdd}*{box-sizing:border-box}body{margin:0;background:#eee5e3;font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#2b2021}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:var(--r);color:white;font-weight:650}button.secondary{background:#f5eeee;color:var(--r);border:1px solid #e5d0d0}button.danger{background:#b22230}button:disabled{opacity:.45}input,select,textarea{width:100%;background:#fff;border:1px solid #ddd0cf;border-radius:10px;padding:12px;min-width:0}label{font-size:12px;color:#725b60;font-weight:700;display:block;margin:10px 0 5px}textarea{min-height:82px}#app{max-width:540px;margin:auto;min-height:100dvh;background:var(--cream);padding-bottom:82px;box-shadow:0 0 22px #4c0d1518}.top{background:linear-gradient(135deg,#530611,#850f22);padding:18px 16px 16px;color:white;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.top strong{font-family:Georgia,serif;font-size:21px}.top small{display:block;opacity:.85}.top button{background:none;padding:7px;font-size:23px}.avatar{width:39px;height:39px;border-radius:50%;background:#f7ddd8;color:#640d1b;display:grid;place-items:center;font-size:22px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.headtitle{flex:1}.content{padding:13px}.card{border:1px solid var(--line);border-radius:15px;background:#fff;margin-bottom:12px;padding:14px;box-shadow:0 2px 8px #57121b08}.card h3{margin:0 0 10px;color:var(--dark);font-size:18px}.section{font-family:Georgia,serif;color:#660b18;font-size:21px;margin:18px 0 10px}.muted{color:#897979;font-size:13px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grow{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:white;color:#720d1c;border:1px solid #eedcdd;min-height:75px}.tile span{display:block;font-size:25px}.mini{font-size:12px}.pill{display:inline-block;font-size:11px;padding:5px 9px;background:#eee;color:#666;border-radius:30px;font-weight:700}.pill.ok{background:#dff4e7;color:#236b43}.pill.warn{background:#fff0ce;color:#906306}.pill.bad{background:#ffebed;color:#a42131}.date{background:#fff0ed;color:#a00f20;font-weight:800;text-align:center;min-width:51px;border-radius:9px;padding:7px;font-size:20px}.date small{display:block;font-size:10px}.item{padding:10px 0;border-bottom:1px solid #f0e9e7}.item:last-child{border:0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;height:72px;background:#5a0814;display:flex;justify-content:space-around;align-items:center;z-index:5}.bottom button{background:transparent;padding:7px 3px;font-size:11px;min-width:65px}.bottom b{font-size:23px;display:block}.overlay{position:fixed;inset:0;background:#0009;z-index:12;display:flex;justify-content:flex-end}.drawer{width:min(330px,90vw);background:#fff;overflow:auto;padding:18px}.drawer button{display:block;width:100%;margin:6px 0;text-align:left;background:#faf5f5;color:#540a15}.login{min-height:100dvh;background:linear-gradient(160deg,#42050d,#8c0d20 55%,#34080d);padding:60px 22px;color:white}.login h1{font:42px Georgia,serif;text-align:center;margin:12px 0 0}.login p{text-align:center}.loginbox{background:#fff;border-radius:18px;padding:20px;color:#302125;margin-top:36px}.loginbox button{width:100%;margin-top:13px}.loginbox .secondary{margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:9px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:8px 4px;border-bottom:1px solid #eee}.subnav{display:flex;gap:6px;margin-bottom:13px;overflow:auto}.subnav button{white-space:nowrap;font-size:12px;padding:9px}.subnav button.off{background:#eee5e3;color:#5b2029}.notice{background:#fbe4e5;color:#771020;padding:11px;border-radius:10px;margin-bottom:10px;font-size:13px}.hidden{display:none} .center{text-align:center}@media print{body,#app{background:white;max-width:none;box-shadow:none}.top,.bottom,.no-print{display:none!important}.content{padding:0}.card{box-shadow:none;break-inside:avoid}#app{padding:0}} </style></head><body><div id="app"><div style="padding:45px 22px;text-align:center;color:#760d1c"><h1 style="font-family:Georgia,serif">✝ Coroinhas</h1><p>Carregando sistema...</p></div></div><script>window.addEventListener('error',function(e){const a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:35px;font-family:system-ui"><h2>Não foi possível carregar o sistema</h2><p>'+String(e.message||'Erro ao carregar script').replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">Tentar novamente</button></div>'});</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('app').innerHTML='<div class=login><h1>✝ Coroinhas</h1><p>Falha ao carregar biblioteca Supabase. Confira a conexão.</p></div>'"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const E=escapeHTML;
let db,me,profiles=[],masses=[],assignments=[],notes=[],requests=[],guides=[],fixed=[],messages=[],tab='home',detail=null,drawer=false,scope='mes',month=new Date().toISOString().slice(0,7),filterDay='',loginMode='login';const el=$('#app');const notify=(msg)=>alert(msg);const fmt=d=>new Date(d).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});const localDay=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});const moneyDate=d=>new Date(d).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'short'}).toUpperCase();const name=id=>profiles.find(p=>p.id===id)?.name||'Vaga disponível';const isCoord=()=>me?.role==='coordenadora'&&me?.approved;
function boot(){if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||SUPABASE_URL.includes('COLE_')){el.innerHTML='<div class="login"><h1>✝ Coroinhas</h1><p>Configure o arquivo config.js com a URL e a chave pública do Supabase.</p></div>';return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);db.auth.onAuthStateChange(()=>setTimeout(start,0));start();setInterval(()=>{if(me)load(false)},30000)}
async function q(table){const {data,error}=await db.from(table).select('*');if(error)throw error;return data||[]}
async function start(){try{const {data:{user}}=await db.auth.getUser();if(!user){me=null;return login()}const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();if(error)throw error;me=data;if(!me.approved){el.innerHTML=`<div class="login"><h1>✝ Coroinhas</h1><p>Seu cadastro aguarda aprovação da coordenadora.</p><button onclick="logout()">Sair</button><button class="secondary" onclick="start()">Atualizar</button></div>`;return}await load()}catch(e){el.innerHTML=`<div class="content"><div class="notice">${E(e.message)}</div><button onclick="start()">Tentar novamente</button></div>`}}
async function load(render=true){try{[profiles,masses,assignments,notes,requests,guides,fixed,messages]=await Promise.all(['profiles','masses','assignments','notifications','requests','guides','fixed_rules','messages'].map(q));masses.sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));if(render)draw()}catch(e){console.error(e);if(render)notify(e.message)}}
function login(){el.innerHTML=`<div class="login"><div class="center" style="font-size:55px">✝</div><h1>Coroinhas</h1><p>Servir é amar.</p><div class="loginbox"><h3>${loginMode==='login'?'Entrar': 'Solicitar cadastro'}</h3><form onsubmit="authSubmit(event)">${loginMode==='signup'?'<label>Nome completo</label><input name="name" required>':''}<label>E-mail</label><input type="email" name="email" required><label>Senha</label><input type="password" name="password" minlength="6" required><button>${loginMode==='login'?'Entrar':'Solicitar acesso'}</button></form><button class="secondary" onclick="loginMode=loginMode==='login'?'signup':'login';login()">${loginMode==='login'?'Criar cadastro':'Já tenho cadastro'}</button></div></div>`}
async function authSubmit(e){e.preventDefault();const f=new FormData(e.target);try{const email=f.get('email'),password=f.get('password');const {error}=loginMode==='signup'?await db.auth.signUp({email,password,options:{data:{name:f.get('name')}}}):await db.auth.signInWithPassword({email,password});if(error)throw error;notify(loginMode==='signup'?'Cadastro criado. Confira seu e-mail, se a confirmação estiver ativada, e aguarde aprovação.':'Login realizado');start()}catch(e){notify(e.message)}}async function logout(){await db.auth.signOut();me=null;loginMode='login';login()}
const nav=(t)=>{tab=t;detail=null;drawer=false;draw()};function top(){return `<div class="top"><div class="avatar" onclick="nav('perfil')">${me.photo_url?`<img src="${E(me.photo_url)}">`:'👤'}</div><div class="headtitle"><strong>✝ Coroinhas</strong><small>${isCoord()?'Coordenadora':'Servir é amar.'}</small></div><button onclick="nav('notificacoes')">♧${notes.filter(n=>!n.seen).length?'🔴':''}</button><button onclick="drawer=true;draw()">☰</button></div>`}
function bottom(){const opts=isCoord()?[['home','⌂','Início'],['missas','▦','Missas'],['coroinhas','♙','Coroinhas'],['relatorios','▤','Relatórios']]:[['home','⌂','Início'],['escalas','▦','Escalas'],['notificacoes','♧','Avisos'],['perfil','♙','Perfil']];return `<div class="bottom">${opts.map(([a,b,c])=>`<button onclick="nav('${a}')"><b>${b}</b>${c}</button>`).join('')}</div>`}
function menu(){const common=[['home','Início'],[isCoord()?'missas':'escalas',isCoord()?'Missas / Escalas':'Escalas mensais'],['notificacoes','Notificações'],['como_usar','Como usar o site'],['guias',isCoord()?'Cadastrar como servir':'Como servir'],['perfil','Meu perfil'],['ajustes','Ajustes'],['suporte','Suporte']];const extra=isCoord()?[['coroinhas','Gerenciar coroinhas'],['fixos','Coroinhas fixos'],['relatorios','Relatórios'],['downloads','Downloads'],['mensagens','Reclamações e sugestões']]:[['mensagem','Reclame aqui / Sugestão']];return `<div class="overlay" onclick="drawer=false;draw()"><div class="drawer" onclick="event.stopPropagation()"><h2>✝ Menu</h2>${[...common,...extra].map(([t,l])=>`<button onclick="nav('${t}')">${l} →</button>`).join('')}<button onclick="logout()">↪ Sair</button><p class="muted">NexoSites • v1.0.0</p></div></div>`}
function draw(){if(!me)return login();let html='';try{html=detail?details():({home:home,missas:missasPage,coroinhas:serversPage,relatorios:reports,escalas:escalaPage,notificacoes:notificationsPage,perfil:profilePage,guias:guidesPage,como_usar:helpPage,fixos:fixedPage,downloads:downloadsPage,mensagens:messagesPage,mensagem:messagePage,ajustes:settingsPage,suporte:supportPage}[tab]||home)()}catch(e){html=`<div class="notice">${E(e.message)}</div>`}el.innerHTML=top()+`<main class="content">${html}</main>`+bottom()+(drawer?menu():'')}
function ass(m){return assignments.filter(a=>a.mass_id===m.id)}function status(s){return `<span class="pill ${['presente','confirmado'].includes(s)?'ok':['desmarcado','faltou'].includes(s)?'bad':'warn'}">${E(s)}</span>`}
function massCard(m,short=false){let a=ass(m),mine=a.find(x=>x.server_id===me.id&&x.status!=='desmarcado');return `<div class="card"><div class="row"><div class="date"><small>${moneyDate(m.starts_at).split(' ')[1]||''}</small>${moneyDate(m.starts_at).split(' ')[0]}</div><div class="grow"><b>${E(m.title)}</b><div class="muted">${fmt(m.starts_at)} • ${E(m.location)}</div>${mine?'<span class="pill ok">Você está escalado</span>':''}</div><button class="secondary" onclick="detail='${m.id}';draw()">Ver</button></div>${!short?`<div class="item">${a.map(x=>`<div class="row between"><span>${E(x.function_name)}: <b>${E(name(x.server_id))}</b></span>${status(x.status)}</div>`).join('')}</div>`:''}${mine&&!isCoord()?`<div class="actions">${localDay(m.starts_at)===localDay(new Date())?`<button onclick="respond('${mine.id}','confirmar')">Confirmar hoje</button>`:''}<button class="secondary" onclick="respond('${mine.id}','desmarcar')">Desmarcar</button></div>`:''}</div>`}
function home(){let future=masses.filter(m=>new Date(m.starts_at)>=new Date(Date.now()-864e5));return `<h2 class="section">Bem-vindo, ${E(me.name.split(' ')[0])}! 🙏</h2><p class="muted">Que bom ter você aqui.</p><div class="grid">${isCoord()?`<button class="tile" onclick="detail='newmass';draw()"><span>▦</span>Cadastrar missa / escala</button><button class="tile" onclick="nav('missas')"><span>▤</span>Escalas mensais</button>`:`<button class="tile" onclick="nav('escalas')"><span>✋</span>Quero servir em um dia</button><button class="tile" onclick="nav('escalas')"><span>▦</span>Escalas mensais</button>`}</div><h2 class="section">${isCoord()?'Próximas missas':'Suas próximas escalas'}</h2>${(isCoord()?future:future.filter(m=>ass(m).some(a=>a.server_id===me.id&&a.status!=='desmarcado'))).slice(0,5).map(m=>massCard(m)).join('')||'<div class="card">Nenhuma escala futura.</div>'}<button class="secondary" onclick="nav('${isCoord()?'missas':'escalas'}')">Ver todas as escalas</button>`}
function monthSelector(){return `<div class="card"><div class="row"><input type="month" value="${month}" onchange="month=this.value;draw()"><button class="secondary" onclick="scope=scope==='mes'?'dia':'mes';draw()">${scope==='mes'?'Ver dia':'Ver mês'}</button></div>${scope==='dia'?`<label>Dia específico</label><input type="date" value="${filterDay}" onchange="filterDay=this.value;draw()">`:''}</div>`}function filtered(){return masses.filter(m=>scope==='dia'&&filterDay?localDay(m.starts_at)===filterDay:localDay(m.starts_at).slice(0,7)===month)}
function escalaPage(){return `<h2 class="section">Escalas mensais</h2>${monthSelector()}${filtered().map(m=>massCard(m,true)+(!ass(m).some(a=>a.server_id===me.id&&a.status!=='desmarcado')?`<div class="actions" style="margin:-5px 0 16px"><button onclick="askServe('${m.id}')">✋ Quero servir nesta missa</button></div>`:'')).join('')||'<div class="card">Nenhuma missa cadastrada neste período.</div>'}`}
function missasPage(){return `<h2 class="section">Gerenciar missas</h2><button onclick="detail='newmass';draw()">+ Cadastrar missa / escala</button><button class="secondary" onclick="nav('downloads')">Baixar PDF</button><br><br>${monthSelector()}${filtered().map(m=>massCard(m,true)).join('')||'<div class="card">Nenhuma missa neste período.</div>'}`}
function details(){if(detail==='newmass'||detail?.startsWith('edit:'))return massForm(detail?.startsWith('edit:')?masses.find(m=>m.id===detail.slice(5)):null);if(detail?.startsWith('server:'))return serverDetail(detail.slice(7));const m=masses.find(m=>m.id===detail);if(!m){detail=null;return home()}let a=ass(m);return `<button class="secondary no-print" onclick="detail=null;draw()">← Voltar</button><h2 class="section">${E(m.title)}</h2><div class="card"><b>${fmt(m.starts_at)}</b><p>${E(m.location)} ${m.celebrant?'• '+E(m.celebrant):''}</p>${m.notes?`<p class="muted">${E(m.notes)}</p>`:''}<h3>Escala</h3><table class="table"><tr><th>Função</th><th>Coroinha</th><th>Situação</th></tr>${a.map(x=>`<tr><td>${E(x.function_name)}</td><td>${E(name(x.server_id))}</td><td>${status(x.status)}</td></tr>`).join('')}</table>${isCoord()?`<div class="actions no-print"><button onclick="detail='edit:${m.id}';draw()">Editar</button><button onclick="printM('${m.id}')">PDF</button><button class="danger" onclick="deleteM('${m.id}')">Apagar</button></div><h3>Controle de presença</h3>${a.map(x=>`<div class="item"><b>${E(name(x.server_id))}</b> • ${E(x.function_name)}<div class="actions"><button onclick="setStatus('${x.id}','presente')">Presente</button><button class="secondary" onclick="setStatus('${x.id}','faltou')">Faltou</button><button class="secondary" onclick="changeServer('${x.id}')">Trocar coroinha</button></div>${x.reason?`<p class="muted">Justificativa: ${E(x.reason)}</p>`:''}</div>`).join('')}`:a.filter(x=>x.server_id===me.id&&x.status!=='desmarcado').map(x=>`<div class="actions no-print">${localDay(m.starts_at)===localDay(new Date())?`<button onclick="respond('${x.id}','confirmar')">Confirmar no dia</button>`:''}<button class="secondary" onclick="respond('${x.id}','desmarcar')">Desmarcar (com justificativa)</button></div>`).join('')} ${!isCoord()?`<button class="secondary no-print" onclick="askServe('${m.id}')">Quero servir</button>`:''}</div>`}
async function mutation(p){try{await p;await load();notify('Salvo com sucesso')}catch(e){notify(e.message)}}async function insert(table,obj){const {error}=await db.from(table).insert(obj);if(error)throw error}async function update(table,obj,id){const {error}=await db.from(table).update(obj).eq('id',id);if(error)throw error}
async function respond(id,action){let reason='';if(action==='desmarcar'){reason=prompt('Justificativa obrigatória para desmarcar:')||'';if(reason.trim().length<3)return notify('Informe uma justificativa')}try{const {error}=await db.rpc('respond_assignment',{p_id:id,p_action:action,p_reason:reason});if(error)throw error;await load();notify('Resposta registrada')}catch(e){notify(e.message)}}
async function askServe(massId,assignmentId=null){try{if(requests.some(r=>r.user_id===me.id&&r.mass_id===massId&&r.status==='pendente'))return notify('Você já tem uma solicitação pendente nesta missa');await insert('requests',{user_id:me.id,mass_id:massId,assignment_id:assignmentId,type:assignmentId?'substituir':'servir'});await load();notify('Solicitação enviada à coordenadora')}catch(e){notify(e.message)}}
function massForm(m){let a=m?ass(m):[];return `<button class="secondary" onclick="detail=null;draw()">← Voltar</button><h2 class="section">${m?'Editar':'Nova'} missa / escala</h2><div class="card"><form onsubmit="saveMass(event,'${m?.id||''}')"><label>Título da missa</label><input name="title" required value="${E(m?.title||'Missa Dominical')}"><label>Data e horário</label><input type="datetime-local" name="starts" required value="${m?new Date(new Date(m.starts_at).getTime()-3*3600000).toISOString().slice(0,16):''}"><label>Local</label><input name="location" value="${E(m?.location||'Igreja Matriz')}"><label>Celebrante</label><input name="celebrant" value="${E(m?.celebrant||'')}"><label>Observações</label><textarea name="notes">${E(m?.notes||'')}</textarea><h3>Funções e escala inicial</h3><div id="roles">${a.map(x=>roleRow(x)).join('')||roleRow()}</div><button type="button" class="secondary" onclick="$('#roles').insertAdjacentHTML('beforeend',roleRow())">+ Adicionar função</button><label><input type="checkbox" name="published" style="width:auto" ${!m||m.published?'checked':''}> Publicar e avisar coroinhas</label><button type="submit" style="width:100%;margin-top:15px">Salvar missa e escala</button></form></div>`}
const rolesDefault=['Missal','Cruz','Círio','Turíbulo','Ofertório','Livro','Acolhimento','Outros'];function roleRow(a){return `<div class="item role"><div class="row"><select class="fun"><option value="">Selecione função</option>${[...new Set([...rolesDefault,...guides.map(g=>g.function_name),a?.function_name].filter(Boolean))].map(x=>`<option ${a?.function_name===x?'selected':''}>${E(x)}</option>`).join('')}</select><button type="button" class="danger" onclick="this.closest('.role').remove()">×</button></div><label>Coroinha inicialmente escalado</label><select class="server"><option value="">Vaga em aberto</option>${profiles.filter(p=>p.approved&&p.role==='coroinha').map(p=>`<option value="${p.id}" ${p.id===a?.server_id?'selected':''}>${E(p.name)}</option>`).join('')}</select></div>`}
async function saveMass(e,id){e.preventDefault();try{const f=e.target;const roles=[...f.querySelectorAll('.role')].map(r=>({function_name:r.querySelector('.fun').value,server_id:r.querySelector('.server').value||null})).filter(x=>x.function_name);if(!roles.length)throw Error('Adicione ao menos uma função');let dt=new Date(f.starts.value);if(isNaN(dt))throw Error('Data inválida');let data={title:f.elements.namedItem("title").value,starts_at:dt.toISOString(),location:f.location.value,celebrant:f.celebrant.value,notes:f.notes.value,published:f.published.checked,created_by:me.id};let mid=id;if(id){await update('masses',data,id);const {error}=await db.from('assignments').delete().eq('mass_id',id);if(error)throw error}else{const {data:d,error}=await db.from('masses').insert(data).select('id').single();if(error)throw error;mid=d.id}for(const r of roles)await insert('assignments',{mass_id:mid,...r});if(data.published){for(const p of profiles.filter(x=>x.approved)){await insert('notifications',{user_id:p.id,title:roles.some(r=>r.server_id===p.id)?'Você está escalado!':'Nova escala cadastrada',body:`${data.title} — ${fmt(data.starts_at)}`})}}detail=null;await load();notify('Missa salva')}catch(e){notify(e.message)}}
async function deleteM(id){if(!confirm('Excluir definitivamente esta missa e todas as escalas?'))return;await mutation((async()=>{const {error}=await db.from('masses').delete().eq('id',id);if(error)throw error;detail=null})())}async function setStatus(id,status){await mutation(update('assignments',{status},id))}async function changeServer(id){let opts=profiles.filter(p=>p.approved&&p.role==='coroinha');let n=prompt('Digite o nome exato de quem vai substituir:\n'+opts.map(p=>p.name).join(', '));if(!n)return;let p=opts.find(x=>x.name.toLowerCase()===n.trim().toLowerCase());if(!p)return notify('Nome não encontrado');await mutation(update('assignments',{server_id:p.id,status:'escalado',reason:null},id))}
function serversPage(){let waiting=profiles.filter(p=>!p.approved);return `<h2 class="section">Coroinhas</h2><div class="card"><h3>Aguardando aprovação (${waiting.length})</h3>${waiting.map(p=>`<div class="item row between"><div><b>${E(p.name)}</b><div class="muted">${E(p.email)}</div></div><button onclick="approve('${p.id}')">Aprovar</button></div>`).join('')||'Nenhuma solicitação'}</div><h3>Coroinhas ativos</h3>${profiles.filter(p=>p.approved&&p.role==='coroinha').map(p=>`<div class="card row between"><b>${E(p.name)}</b><button class="secondary" onclick="detail='server:${p.id}';draw()">Detalhes</button></div>`).join('')}`}
async function approve(id){await mutation(update('profiles',{approved:true},id))}function serverDetail(id){let p=profiles.find(x=>x.id===id),a=assignments.filter(x=>x.server_id===id);return `<button class="secondary" onclick="detail=null;draw()">← Voltar</button><h2 class="section">${E(p.name)}</h2><div class="card"><div class="grid">${['confirmado','desmarcado','faltou','presente'].map(s=>`<div class="card"><b>${a.filter(x=>x.status===s).length}</b><p>${s}</p></div>`).join('')}</div><label>Observações internas</label><textarea id="servernotes">${E(p.notes||'')}</textarea><button onclick="mutation(update('profiles',{notes:$('#servernotes').value},'${id}'))">Salvar observações</button><button class="danger" onclick="mutation(update('profiles',{approved:false},'${id}'))">Desativar acesso</button></div>`}
function notificationsPage(){return `<h2 class="section">Notificações</h2>${isCoord()?`<div class="card"><h3>Solicitações de servir / substituir</h3>${requests.filter(r=>r.status==='pendente').map(r=>`<div class="item"><b>${E(name(r.user_id))}</b> pediu para ${r.type==='servir'?'servir':'substituir'} em ${E(masses.find(m=>m.id===r.mass_id)?.title||'missa')}<div class="actions"><button onclick="decideRequest('${r.id}',true)">Aprovar</button><button class="secondary" onclick="decideRequest('${r.id}',false)">Recusar</button></div></div>`).join('')||'Sem solicitações pendentes'}</div>`:''}${notes.filter(n=>n.user_id===me.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(n=>`<div class="card"><b>${E(n.title)}</b><p>${E(n.body)}</p><span class="muted">${fmt(n.created_at)}</span></div>`).join('')||'<div class="card">Nenhuma notificação.</div>'}<button class="secondary" onclick="markRead()">Marcar tudo como lido</button>`}
async function markRead(){const {error}=await db.from('notifications').update({seen:true}).eq('user_id',me.id).eq('seen',false);if(error)notify(error.message);else load()}
async function decideRequest(id,yes){try{const r=requests.find(x=>x.id===id);if(yes){let a=r.assignment_id?assignments.find(x=>x.id===r.assignment_id):assignments.find(x=>x.mass_id===r.mass_id&&(!x.server_id||x.status==='desmarcado'));if(!a)throw Error('Não há vaga livre. Abra a missa e ajuste as funções antes de aprovar.');await update('assignments',{server_id:r.user_id,status:'escalado',reason:null},a.id)}await update('requests',{status:yes?'aprovado':'recusado'},id);await insert('notifications',{user_id:r.user_id,title:yes?'Solicitação aprovada':'Solicitação recusada',body:'Confira suas escalas.'});await load()}catch(e){notify(e.message)}}
function reports(){let relevant=assignments.filter(a=>masses.some(m=>m.id===a.mass_id&&localDay(m.starts_at).slice(0,7)===month));const cnt=s=>relevant.filter(a=>a.status===s).length;return `<h2 class="section">Relatórios</h2><div class="card"><input type="month" value="${month}" onchange="month=this.value;draw()"></div><div class="grid">${[['Missas',filtered().length],['Escalados',relevant.length],['Confirmados',cnt('confirmado')],['Presentes',cnt('presente')],['Desmarcaram',cnt('desmarcado')],['Faltas',cnt('faltou')]].map(([l,v])=>`<div class="card"><h3>${v}</h3>${l}</div>`).join('')}</div><button onclick="nav('downloads')">Exportar PDF</button>`}
function downloadsPage(){return `<h2 class="section">Download das escalas</h2><div class="card"><label>Período</label><select id="pperiod"><option value="day">Dia</option><option value="week">Semana</option><option value="month" selected>Mês</option></select><label>Data de referência</label><input type="date" id="pdate" value="${localDay(new Date())}"><label>Tipo</label><select id="ptype"><option value="full">Completo, com situações</option><option value="public">Escala para compartilhar</option></select><button onclick="printRange()">Gerar PDF / Imprimir</button><p class="muted">No iPhone: Compartilhar → Imprimir → Salvar em Arquivos como PDF.</p></div>`}
function printRange(){let d=$('#pdate').value,p=$('#pperiod').value,t=$('#ptype').value,start=new Date(d+'T00:00:00-03:00'),end=new Date(start);if(p==='day')end.setDate(end.getDate()+1);if(p==='week'){start.setDate(start.getDate()-start.getDay());end=new Date(start);end.setDate(end.getDate()+7)}if(p==='month'){start.setDate(1);end=new Date(start);end.setMonth(end.getMonth()+1)}let selected=masses.filter(m=>new Date(m.starts_at)>=start&&new Date(m.starts_at)<end);printList(selected,t)}function printM(id){printList(masses.filter(m=>m.id===id),'full')}
function printList(ms,type){const area=document.createElement('section');area.id='printarea';area.innerHTML=`<h1>✝ Coroinhas — Escalas</h1>${ms.map(m=>`<h2>${E(m.title)} • ${fmt(m.starts_at)}</h2><p>${E(m.location)}</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="9"><tr><th>Função</th><th>Coroinha</th>${type==='full'?'<th>Situação</th>':''}</tr>${ass(m).map(a=>`<tr><td>${E(a.function_name)}</td><td>${E(name(a.server_id))}</td>${type==='full'?`<td>${E(a.status)}</td>`:''}</tr>`).join('')}</table>`).join('')||'<p>Sem missas neste período.</p>'}<p style="font-size:11px">NexoSites • Coroinhas</p>`;const win=window.open('','_blank');if(!win){notify('Permita pop-ups para exportar o PDF');return}win.document.write(`<html><head><meta name="viewport" content="width=device-width"><style>body{font-family:Arial;padding:22px;color:#380812}table{margin-bottom:25px}th{background:#f7eaea}h1{color:#7b0b1d}h2{margin-top:28px}</style></head><body>${area.innerHTML}</body></html>`);win.document.close();setTimeout(()=>win.print(),350)}
function guidesPage(){return `<h2 class="section">${isCoord()?'Cadastrar como servir':'Como servir'}</h2>${isCoord()?`<div class="card"><form onsubmit="saveGuide(event)"><label>Função litúrgica</label><input name="function_name" required><label>Como servir</label><textarea name="instructions" required></textarea><label>Observações</label><textarea name="notes"></textarea><button>Salvar guia</button></form></div>`:''}${guides.map(g=>`<div class="card"><h3>${E(g.function_name)}</h3><p style="white-space:pre-wrap">${E(g.instructions)}</p><p class="muted">${E(g.notes)}</p>${isCoord()?`<button class="danger" onclick="removeGuide('${g.id}')">Excluir</button>`:''}</div>`).join('')||'<div class="card">Ainda não há instruções cadastradas.</div>'}`}
async function saveGuide(e){e.preventDefault();let f=e.target;try{await insert('guides',{function_name:f.function_name.value,instructions:f.instructions.value,notes:f.notes.value});await load()}catch(e){notify(e.message)}}async function removeGuide(id){if(confirm('Excluir guia?'))await mutation((async()=>{const {error}=await db.from('guides').delete().eq('id',id);if(error)throw error})())}
function fixedPage(){return `<h2 class="section">Coroinhas fixos</h2><div class="card"><form onsubmit="saveFixed(event)"><label>Coroinha</label><select name="server_id">${profiles.filter(p=>p.approved&&p.role==='coroinha').map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><label>Dia da semana</label><select name="weekday">${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((v,i)=>`<option value="${i}">${v}</option>`).join('')}</select><label>Horário</label><input type="time" name="time" value="19:00" required><label>Função</label><input name="function_name" required placeholder="Cruz"><label>Local (opcional)</label><input name="location" placeholder="Igreja Matriz"><button>Salvar regra fixa</button></form></div>${fixed.map(r=>`<div class="card">${E(name(r.server_id))} • ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][r.weekday]} • ${String(r.hour).padStart(2,'0')}:${String(r.minute).padStart(2,'0')} • ${E(r.function_name)}</div>`).join('')}<button onclick="autoFill()">Aplicar fixos nas vagas abertas do mês</button><p class="muted">A rotina só ocupa vagas sem coroinha ou desmarcadas e exige coincidência de dia, horário, função e local.</p>`}
async function saveFixed(e){e.preventDefault();let f=e.target;let [h,m]=f.time.value.split(':').map(Number);await mutation(insert('fixed_rules',{server_id:f.server_id.value,weekday:+f.weekday.value,hour:h,minute:m,function_name:f.function_name.value,location:f.location.value}))}
async function autoFill(){try{let count=0;for(const m of masses.filter(x=>localDay(x.starts_at).slice(0,7)===month)){let dt=new Date(m.starts_at);let local=new Date(dt.toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));for(const r of fixed){if(local.getDay()!==r.weekday||local.getHours()!==r.hour||local.getMinutes()!==r.minute||r.location&&r.location.toLowerCase()!==m.location.toLowerCase())continue;let a=ass(m).find(x=>x.function_name.toLowerCase()===r.function_name.toLowerCase()&&(!x.server_id||x.status==='desmarcado'));if(!a||ass(m).some(x=>x.server_id===r.server_id&&x.status!=='desmarcado'))continue;await update('assignments',{server_id:r.server_id,status:'escalado',reason:null},a.id);count++}}await load();notify(`${count} vaga(s) preenchida(s). Revise a escala.`)}catch(e){notify(e.message)}}
function messagesPage(){return `<h2 class="section">Reclamações e sugestões</h2>${messages.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(m=>`<div class="card"><b>${E(m.type)} — ${E(name(m.user_id))}</b><p>${E(m.body)}</p></div>`).join('')||'<div class="card">Nenhuma mensagem.</div>'}`}
function messagePage(){return `<h2 class="section">Reclame aqui / Sugestão</h2><div class="card"><form onsubmit="sendMsg(event)"><label>Assunto</label><select name="type"><option value="reclamacao">Reclamação</option><option value="sugestao">Sugestão</option></select><label>Mensagem</label><textarea name="body" required minlength="5"></textarea><button>Enviar à coordenadora</button></form></div>`}async function sendMsg(e){e.preventDefault();let f=e.target;await mutation(insert('messages',{user_id:me.id,type:f.type.value,body:f.body.value}));f.reset()}
function profilePage(){return `<h2 class="section">Meu perfil</h2><div class="card"><form onsubmit="saveProfile(event)"><label>Nome</label><input name="name" value="${E(me.name)}" required><label>URL pública da foto (https)</label><input name="photo_url" value="${E(me.photo_url||'')}" placeholder="https://..."><label>E-mail</label><input disabled value="${E(me.email)}"><button>Salvar</button></form></div>`}async function saveProfile(e){e.preventDefault();let f=e.target;if(f.photo_url.value&&!f.photo_url.value.startsWith('https://'))return notify('Use imagem com https://');await mutation(update('profiles',{name:f.elements.namedItem("name").value,photo_url:f.photo_url.value||null},me.id));me={...me,name:f.elements.namedItem("name").value,photo_url:f.photo_url.value}}
function helpPage(){return `<h2 class="section">Como usar o site</h2><div class="card">${isCoord()?`<h3>Coordenadora</h3><p>1. Aprove novos usuários em Coroinhas.</p><p>2. Cadastre missas, funções e coroinhas escalados.</p><p>3. Use Coroinhas fixos para preencher vagas do mês.</p><p>4. Acompanhe pedidos e justificativas em Notificações.</p><p>5. Registre presenças e faltas em Detalhes da missa.</p><p>6. Exporte escalas em Downloads.</p><p>7. Cadastre orientações no menu Como servir.</p>`:`<h3>Coroinha</h3><p>1. Veja suas próximas escalas no Início.</p><p>2. Acesse Escalas mensais para ver todas as missas e solicitar para servir.</p><p>3. Caso não possa servir, desmarque com justificativa antes da missa.</p><p>4. No dia da missa, confirme presença.</p><p>5. Consulte as funções em Como servir.</p><p>6. Envie sugestões ou reclamações pelo menu.</p>`}</div>`}
function settingsPage(){return `<h2 class="section">Ajustes</h2><div class="card"><button onclick="nav('perfil')">Editar perfil</button><p class="muted">Aparência vermelho vinho • Atualização periódica quando o site está aberto.</p></div>`}function supportPage(){return `<h2 class="section">Suporte técnico</h2><div class="card"><p>Entre em contato com o responsável pelo site. O número de suporte ainda precisa ser configurado.</p><p class="muted">NexoSites • v1.0.0</p></div>`}
boot();</script></body></html>
