name: Neon migration validation (isolated)
on:
  push:
    branches:
      - migration/neon-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_MIGRATION_ENABLED: "false"
      NEXT_PUBLIC_DATA_BACKEND: "supabase"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate migration script syntax (read-only)
        run: node --check migration/sync.mjs
      - name: Unit and security tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build without production credentials
        run: npm run build
