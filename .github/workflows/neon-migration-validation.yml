name: Neon migration validation (isolated)
on:
  push:
    branches:
      - migration/neon-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_MIGRATION_ENABLED: "false"
      NEXT_PUBLIC_DATA_BACKEND: "supabase"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Identify npm security advisories (non-blocking diagnostic)
        run: |
          npm audit --json --omit=dev > npm-security-audit.json || true
          node -e 'const a=require("./npm-security-audit.json"); for(const [name,v] of Object.entries(a.vulnerabilities||{})){console.log(JSON.stringify({package:name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))}'
      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Validate migration script syntax (read-only)
        run: node --check migration/sync.mjs
      - name: Validate push readiness script syntax
        run: node --check migration/push-readiness.mjs
      - name: Validate disabled push test dispatcher syntax
        run: node --check migration/push-test-dispatch.mjs
      - name: Unit and security tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build without production credentials
        run: npm run build
