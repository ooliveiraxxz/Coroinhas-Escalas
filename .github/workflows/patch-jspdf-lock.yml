name: Update jsPDF security lockfile (staging only)
on:
  push:
    branches:
      - migration/neon-20261106
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.repository == 'ooliveiraxxz/Coroinhas-Escalas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve patched lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Require patched jsPDF version in both manifests
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(p.dependencies.jspdf!=="4.2.1"||l.packages["node_modules/jspdf"]?.version!=="4.2.1"){process.exitCode=1;console.error("jsPDF lockfile is not patched")}'
      - name: Commit only the lockfile to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): lock jsPDF to patched 4.2.1'
            git push origin HEAD:migration/neon-20261106
          fi
