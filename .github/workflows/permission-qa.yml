name: QA permission isolation (no production writes)
on:
  push:
    branches:
      - qa/permission-isolation-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_MIGRATION_ENABLED: "false"
      NEXT_PUBLIC_DATA_BACKEND: "supabase"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check types
        run: npx tsc --noEmit
      - name: Build without production credentials
        run: npm run build
