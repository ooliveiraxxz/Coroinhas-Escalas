name: QA permission isolation (no production writes)
on:
  push:
    branches:
      - qa/permission-isolation-20261113
      - qa/cerimoniario-global-theme-20261113
      - fix/delegated-developer-health-20261113
      - fix/ceremony-panel-metrics-theme-20261113
      - fix/developer-theme-preference-20261113
      - fix/opt-in-theme-permission-all-roles-20261113
      - fix/developer-self-permissions-theme-rpc-20261114
      - fix/cross-role-permission-enforcement-20261114
      - fix/delegated-role-change-guard-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_MIGRATION_ENABLED: "false"
      NEXT_PUBLIC_DATA_BACKEND: "supabase"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Permission regression tests
        run: node --import tsx --test tests/permission-isolation.test.ts tests/ceremony-theme.test.ts tests/delegated-developer-health.test.ts tests/ceremony-panel-metrics.test.ts tests/developer-theme-preference.test.ts tests/developer-self-permission-rpc.test.ts tests/cross-role-delegated-permissions.test.ts tests/delegated-role-change-guard.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build without production credentials
        run: npm run build

  general-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_MIGRATION_ENABLED: "false"
      NEXT_PUBLIC_DATA_BACKEND: "supabase"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Complete existing test suite
        run: npm test
